services:
  tubctl:
    # Build locally from the Dockerfile in this repo. After code changes run
    # `docker compose up -d --build` (or `docker compose build`) to rebuild.
    # To pin to the published image instead, swap `build:` for
    # `image: fanuelsen/tubctl:latest`.
    build:
      context: .
      dockerfile: Dockerfile
    image: tubctl:local
    container_name: tubctl
    # Bridge + explicit port publish. host networking doesn't expose ports on
    # Docker Desktop for Mac/Windows; outbound to the LAN tub works fine via
    # the VM's NAT regardless.
    ports:
      - "${PORT:-3000}:3000"
    environment:
      TUB_HOST:    ${TUB_HOST:-172.31.0.105}
      TUB_PORT:    ${TUB_PORT:-12416}
      PORT:        3000
      TIME_FORMAT: ${TIME_FORMAT:-24}   # "24" (default) or "12"
      TZ:          ${TZ:-UTC}           # scheduler timezone, e.g. Europe/Oslo
      DATA_DIR:    /data                # where recurring schedules are persisted
      LOG_LEVEL:   ${LOG_LEVEL:-info}   # debug|info|warn|error
    # Persist recurring schedules across rebuilds/restarts.
    volumes:
      - tubctl-data:/data
    restart: unless-stopped

volumes:
  tubctl-data:
