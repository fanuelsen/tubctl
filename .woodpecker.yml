steps:
  # Step 1: Run tests
  test:
    image: golang:1.26.3-alpine
    commands:
      - go test -v ./...
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 2: Security audit (fail only on fixable vulnerabilities)
  security:
    image: golang:1.26.3-alpine
    commands:
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - |
        set +e
        govulncheck ./... > /tmp/vuln.out 2>&1
        RESULT=$$?
        set -e
        cat /tmp/vuln.out
        if [ "$$RESULT" -eq 0 ]; then
          echo "No vulnerabilities found."
          exit 0
        elif [ "$$RESULT" -eq 3 ]; then
          FIXABLE=$$(grep "Fixed in:" /tmp/vuln.out | grep -cv "N/A" || true)
          if [ "$$FIXABLE" -gt 0 ]; then
            echo ""
            echo "FAILED: $$FIXABLE fixable vulnerabilities. Update dependencies."
            exit 1
          fi
          echo ""
          echo "Only unfixable vulnerabilities (no patch available). Passing."
          exit 0
        else
          echo "govulncheck error (exit code $$RESULT)"
          exit 1
        fi
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 3: Build binary (proves it compiles + reports size)
  build:
    image: golang:1.26.3-alpine
    commands:
      - apk add --no-cache git
      - CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${CI_COMMIT_TAG:-dev}" -trimpath -o tubctl ./cmd/tubctl
      - ls -lh tubctl
    when:
      event:
        - pull_request
        - tag
        - push

  # Step 4: Auto-tag patch release on push to main
  auto-tag:
    image: alpine
    commands:
      - apk add --no-cache git
      - git fetch --tags
      - |
        if git tag --points-at HEAD | grep -q '^v'; then
          echo "HEAD already has a version tag, skipping"
          exit 0
        fi
      - |
        git config user.email "ci@tubctl"
        git config user.name "Woodpecker CI"
        LATEST=$$(git tag -l 'v*' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)
        if [ -z "$$LATEST" ]; then
          NEW_TAG="v0.1.0"
        else
          MAJOR=$$(echo "$$LATEST" | cut -d. -f1)
          MINOR=$$(echo "$$LATEST" | cut -d. -f2)
          PATCH=$$(echo "$$LATEST" | cut -d. -f3)
          PATCH=$$(($$PATCH + 1))
          NEW_TAG="v$${MAJOR}.$${MINOR}.$${PATCH}"
        fi
        echo "Tagging $$NEW_TAG"
        git tag -a "$$NEW_TAG" -m "Auto-release $$NEW_TAG"
        REPO_URL=$$(echo "${CI_FORGE_URL}/${CI_REPO}.git" | sed 's|https://|https://token:'"$${CI_FORGE_TOKEN}"'@|')
        git push "$$REPO_URL" "$$NEW_TAG"
    environment:
      CI_FORGE_TOKEN:
        from_secret: forgejo_token
    when:
      event:
        - push
      branch:
        - main

  # Step 5a: Build & push image to Forgejo container registry (primary)
  docker-release-forgejo:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      registry: forgejo.sublog.org
      repo: forgejo.sublog.org/sublog.org/tubctl
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username:
        from_secret: forgejo_registry_user
      password:
        from_secret: forgejo_registry_pass
    when:
      event:
        - tag

  # Step 5b: Mirror image to Docker Hub for public discoverability
  docker-release-hub:
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: fanuelsen/tubctl
      dockerfile: Dockerfile
      platforms: linux/amd64,linux/arm64
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      event:
        - tag

  # Step 6: Create Forgejo release with binary attached
  forgejo-release:
    image: woodpeckerci/plugin-release
    settings:
      base_url: ${CI_FORGE_URL}
      api_key:
        from_secret: forgejo_token
      files:
        - tubctl
      title: "tubctl ${CI_COMMIT_TAG}"
      note: |
        ## tubctl ${CI_COMMIT_TAG}

        LAN-only control for Bestway Airjet hot tubs over the Gizwits protocol.

        ### Container image
        ```bash
        # From Forgejo (primary)
        docker pull forgejo.sublog.org/sublog.org/tubctl:${CI_COMMIT_TAG}
        # Or from Docker Hub
        docker pull fanuelsen/tubctl:${CI_COMMIT_TAG}
        ```

        ### Binary
        Download `tubctl` from assets below. Static linux/amd64; build from source for other arches.

        ```bash
        chmod +x tubctl
        sudo mv tubctl /usr/local/bin/tubctl
        TUB_HOST=192.168.x.x tubctl
        ```
      checksum:
        - sha256
      file_exists: skip
    when:
      event:
        - tag
